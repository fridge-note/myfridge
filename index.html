<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#163f36"><meta name="description" content="記下冰箱食材、分類與有效期限，讓每一份新鮮都被好好使用。"><meta name="apple-mobile-web-app-capable" content="yes"><title>冰箱小本本</title><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="apple-touch-icon" href="./icon-192.png"><link rel="stylesheet" href="./style.css"></head>
<body><main><header><div class="brand">我的冰箱</div><div class="header-actions"><button id="install" hidden>安裝</button><button id="help" aria-label="安裝說明">ⓘ</button><button class="primary add">＋ 新增</button></div></header><nav id="categories" aria-label="食材分類"></nav><section class="list-heading"><span id="count"></span><label><span class="sr-only">排序</span><select id="sort"><option value="expiry">期限近到遠</option><option value="newest">最新加入</option></select></label></section><div id="list"></div></main>
<dialog id="editor"><form id="form"><div class="dialog-heading"><div><p class="eyebrow">幫新鮮找個位置</p><h2 id="editor-title">新增食材</h2></div><button type="button" class="close" aria-label="關閉">✕</button></div><label>食材名稱<input id="name" required maxlength="60" placeholder="例如：青花菜、雞胸肉" autocomplete="off"></label><label>分類<select id="category"></select></label><label>購買日期<input id="purchase-date" type="date" required></label><div class="form-row"><label for="quantity">數量<div class="input-stepper"><button type="button" data-step-input="#quantity" data-delta="-1" aria-label="數量減一">−</button><input id="quantity" type="number" min="0.001" max="1000000" step="0.001" value="1" required><button type="button" data-step-input="#quantity" data-delta="1" aria-label="數量加一">＋</button></div></label><label>單位<select id="unit"></select><input id="unit-custom" maxlength="15" placeholder="輸入其他單位" aria-label="自訂單位" hidden></label></div><label>有效期限（選填）<input id="expiry" type="date"></label><p class="form-note">有效期限可留空；有包裝標示時再填寫。</p><button id="save-item" class="primary save" type="submit">加入冰箱</button></form></dialog>
<dialog id="quantity-dialog"><form id="quantity-form"><div class="dialog-heading"><h2 id="quantity-title">調整數量</h2><button type="button" class="close" aria-label="關閉">✕</button></div><input id="quantity-id" type="hidden"><div class="form-row"><label>剩餘數量<input id="remaining" type="number" min="0" max="1000000" step="0.001" required></label><label>單位<select id="remaining-unit"></select><input id="remaining-unit-custom" maxlength="15" placeholder="輸入其他單位" aria-label="自訂單位" hidden></label></div><p class="form-note">設為 0 會移出冰箱，操作後可以復原。</p><button class="primary save" type="submit">儲存數量</button></form></dialog><dialog id="help-dialog"><div class="dialog-heading"><h2>把冰箱放進手機</h2><button class="close" aria-label="關閉">✕</button></div><p>iPhone：在 Safari 打開這個網址，點分享按鈕，選「加入主畫面」。</p><p>Android：在 Chrome 選單中選「安裝應用程式」或「加入主畫面」。</p><p>資料儲存在這個瀏覽器；清除瀏覽器資料後紀錄也會刪除。</p><p>安裝選項由瀏覽器提供。第一次連線開啟後，可離線查看與記錄食材。</p></dialog><div id="toast" role="status" hidden><span></span><button hidden>復原</button></div><script src="./app.js" defer></script></body></html>
